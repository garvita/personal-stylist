[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "personal-stylist"
version = "0.1.0"
description = "A personal stylist application that helps manage your wardrobe and recommends outfits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
stylist = "personal_stylist.cli:main"
stylist-web = "personal_stylist.webapp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
