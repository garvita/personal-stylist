{% extends "base.html" %}
{% block title %}Add Item — Personal Stylist{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add to Wardrobe</h1>
    <p class="subtitle">Upload a photo of your clothing item</p>
  </div>
</div>

<div class="card" style="max-width: 640px;">
  <div class="card-body" style="padding: 1.5rem;">
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="image">Photo</label>
        <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,.gif,.webp,.bmp" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">Select&hellip;</option>
          {% for cat in categories %}
            <option value="{{ cat }}">{{ cat | capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary">Add to Wardrobe</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
