<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Personal Stylist{% endblock %}</title>
  <style>
    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --accent: #2d2d2d;
      --accent-hover: #444444;
      --border: #e8e6e3;
      --success: #3a7d44;
      --error: #c0392b;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ---- Nav ---- */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    nav .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    nav .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    nav .nav-links {
      display: flex;
      gap: 0.25rem;
      list-style: none;
    }
    nav .nav-links a {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    nav .nav-links a:hover,
    nav .nav-links a.active {
      background: var(--bg);
      color: var(--text);
    }

    /* ---- Main ---- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ---- Flash messages ---- */
    .flash {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .flash.success { background: #edf7ee; color: var(--success); border: 1px solid #c6e6c8; }
    .flash.error { background: #fdf0ef; color: var(--error); border: 1px solid #f0c6c1; }

    /* ---- Typography ---- */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* ---- Cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-size: 2.5rem;
    }
    .card-body {
      padding: 1rem;
    }
    .card-body h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .card-body p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    /* ---- Grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    /* ---- Tags / Badges ---- */
    .tag {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag-category { background: #eee; color: #555; }
    .tag-season { background: #e8f0fe; color: #1a56db; }
    .tag-occasion { background: #fef3e2; color: #b45309; }

    /* ---- Color swatch ---- */
    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--border);
      vertical-align: middle;
      margin-right: 0.3rem;
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid #f0c6c1;
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
    }
    .btn-danger:hover { background: #fdf0ef; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--bg); }

    /* ---- Forms ---- */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group input[type="file"] {
      font-size: 0.85rem;
    }
    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .checkbox-grid label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 400;
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .checkbox-grid label:hover {
      background: var(--bg);
    }
    .checkbox-grid input[type="checkbox"] {
      accent-color: var(--accent);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* ---- Stats bar ---- */
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      min-width: 120px;
      box-shadow: var(--shadow);
    }
    .stat-item .stat-num {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .stat-item .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ---- Outfit cards ---- */
    .outfit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
    }
    .outfit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .outfit-header h3 { font-size: 1rem; }
    .score-badge {
      background: var(--accent);
      color: #fff;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .outfit-items {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .outfit-item-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
    }

    /* ---- Filter bar ---- */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .filter-bar .form-group { margin-bottom: 0; }
    .filter-bar select {
      min-width: 150px;
    }

    /* ---- Page header ---- */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    /* ---- Empty state ---- */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      main { padding: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      nav { padding: 0 1rem; }
      .page-header { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="{{ url_for('index') }}" class="logo">Personal Stylist</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Wardrobe</a></li>
        <li><a href="{{ url_for('add_item') }}" class="{{ 'active' if request.endpoint == 'add_item' }}">Add Item</a></li>
        <li><a href="{{ url_for('recommend') }}" class="{{ 'active' if request.endpoint == 'recommend' }}">Outfits</a></li>
        <li><a href="{{ url_for('profile') }}" class="{{ 'active' if request.endpoint == 'profile' }}">Profile</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
